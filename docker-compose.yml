services:
  isg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isg-mian
    environment:
      DISPLAY: host.docker.internal:0.0
      QT_QPA_PLATFORM: xcb
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./settings:/app/settings
      - ./plugins:/app/plugins
    restart: unless-stopped
